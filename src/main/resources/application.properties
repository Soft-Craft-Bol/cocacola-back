spring.application.name=cocacola
# Mensajes de validacion siempre en espanol
spring.web.locale=es
spring.web.locale-resolver=fixed
server.port=8080
# Todas las rutas quedan bajo /api (el frontend usa VITE_API_URL=http://localhost:8080/api)
server.servlet.context-path=/api

# Base de datos PostgreSQL en Neon (cada valor se puede sobreescribir con su variable de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-withered-truth-b651b0fi-pooler.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_3lwrY0mJRnAd}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: en produccion definir JWT_SECRET (minimo 32 caracteres)
app.security.jwt.secret=${JWT_SECRET:cocacola-event-intelligence-dev-secret-change-me-0123456789}
app.security.jwt.expiration-minutes=480

# Origenes permitidos (frontend)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Zona horaria para indicadores por hora
app.timezone=America/Bogota

# Carga inicial: usuarios demo y catalogo de productos (solo si las tablas estan vacias)
app.seed.enabled=true

# Datos de demostracion (3 eventos con participantes). Poner en false para una base limpia
app.seed.demo=true

# Cloudinary (imagenes de los eventos). Escribe aqui tu API secret o define CLOUDINARY_API_SECRET
cloudinary.cloud-name=dlosdgwh2
cloudinary.api-key=235659652886782
cloudinary.api-secret=wvN-F833G3TXxLgil3KkLebBJGM

# Subida de archivos (la imagen de un evento pesa maximo 5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Power BI: clave de API para leer /api/bi/** (cabecera X-API-Key o parametro ?key=). Cambiala o define BI_API_KEY.
bi.api-key=${BI_API_KEY:b204db2f4e46327466edf406d0aeb58b92290addc31b57fb}

# Inteligencia artificial (resumenes). Sin ninguna clave, la plataforma genera el resumen con reglas propias.
# Opcion 1: Claude (de pago). Define ANTHROPIC_API_KEY o escribe la clave aqui.
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.model=claude-sonnet-5-5

# URL publica del frontend (se usa en los enlaces de los correos y mensajes)
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
# Recordatorios (24 h antes) y agradecimientos con encuesta (dia siguiente) automaticos
app.automation.enabled=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:softcraft2024@gmail.com}
spring.mail.password=${MAIL_PASSWORD:zqiwwduqgjchmeml}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Remitente: Gmail siempre envia desde la cuenta autenticada, asi que por defecto es MAIL_USERNAME
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Notificaciones del equipo por correo (metas alcanzadas y encuestas con NPS bajo).
# Destinatarios separados por coma; si se deja vacio se envian a la propia cuenta de MAIL_USERNAME.
notifications.email-enabled=true
notifications.email-to=${NOTIFY_EMAILS:}

# WhatsApp Business Cloud API (Meta). Sin credenciales queda desactivado (el frontend ofrece enlaces wa.me).
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.default-country-code=57

# CRM por webhook (HubSpot, Salesforce, Zapier, Make...). Recibe un POST JSON por cada contacto con consentimiento.
crm.webhook-url=${CRM_WEBHOOK_URL:}
crm.api-key=${CRM_API_KEY:}

# Opcion 2: cualquier API compatible con OpenAI. Con OpenCode Zen hay modelos GRATIS (clave en opencode.ai/zen):
#   ai.openai.base-url=https://opencode.ai/zen/v1
#   ai.openai.model=big-pickle            (otros gratis: ling-3.1-flash-free, nemotron-3-ultra-free, mimo-v2.5-free)
#   ai.openai.api-key=tu-clave
# Tambien sirve Groq, OpenRouter u Ollama local (base-url=http://localhost:11434/v1, model=llama3.2, sin clave).
ai.openai.base-url=${AI_BASE_URL:https://opencode.ai/zen/v1}
ai.openai.model=${AI_MODEL:big-pickle}
ai.openai.api-key=${AI_API_KEY:}

# Consulta publica de entradas ("Mi entrada"): maximo de intentos por IP dentro de la ventana
public.lookup.max-attempts=10
public.lookup.window-minutes=10
